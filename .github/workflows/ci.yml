---
name: CI

"on":
  push:
    branches:
      - ansible-core-2.20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The role is checked out into a directory named after its role name, so
# `include_role: realtime.rustfs` resolves through ANSIBLE_ROLES_PATH.
defaults:
  run:
    working-directory: realtime.rustfs

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: realtime.rustfs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.rustfs/molecule/requirements.txt

      - name: Install lint tools
        run: pip install pre-commit "ansible-core>=2.20,<2.21" ansible-lint

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('realtime.rustfs/.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # TrueNAS cannot be a molecule target, so the role runs on a Debian container
  # (TrueNAS SCALE is Debian-based) against a mock midclt and a stub S3 endpoint
  # that answers 403. The platform is the one in molecule/default/molecule.yml.
  molecule:
    name: Molecule default / debian-trixie
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: realtime.rustfs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.rustfs/molecule/requirements.txt

      - name: Install Ansible and molecule
        run: pip install -r molecule/requirements.txt "ansible-core>=2.20,<2.21"

      # ansible-core alone does not ship community.docker, which drives the
      # molecule containers.
      - name: Install collections
        run: ansible-galaxy collection install community.docker

      - name: Run molecule test
        run: molecule test -s default
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_DEPRECATION_WARNINGS: "0"
          # molecule-plugins' create.yml has a non-boolean `when:`, which
          # ansible-core 2.19+ rejects unless this is set.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "true"
