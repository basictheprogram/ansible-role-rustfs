---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian-trixie
    image: geerlingguy/docker-debian13-ansible:latest
    cgroupns_mode: host
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PREPARE_PLAYBOOK:-prepare.yml}
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: testinfra
  directory: tests/
  options:
    v: true
    p: "no:cacheprovider"
